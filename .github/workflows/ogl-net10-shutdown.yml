name: OGL .NET 10 Persistence and Shutdown Gate

on:
  pull_request:
    paths:
      - 'OpenSim/Region/Framework/Scenes/KeyframeMotion.cs'
      - 'OpenSim/Region/ClientStack/Linden/UDP/UnackedPacketCollection.cs'
      - 'OpenSim/Region/Framework/Scenes/SceneManager.cs'
      - 'OpenSim/Region/Framework/Scenes/Scene.cs'
      - 'OpenSim/Region/Application/OpenSimBase.cs'
      - 'OpenSim/Region/Application/Application.cs'
      - 'OpenSim/Framework/Servers/ServerBase.cs'
      - 'OpenSim/Framework/Servers/BaseOpenSimServer.cs'
      - 'OpenSim/Region/Application/OpenSimBackground.cs'
      - 'tools/ci/Net10ShutdownRegression/**'
      - 'tools/ci/LegacyKeyframeFixture/**'
      - 'tools/migration/KeyframeLegacyConverter/**'
      - 'doc/NexVerse/KEYFRAME_LEGACY_MIGRATION.md'
      - 'tools/ci/verify_net10_shutdown.py'
      - 'tools/ci/smoke_g1_multi_region_shutdown.py'
      - 'tools/ci/inject_shutdown_hang_ci_only.py'
      - 'tools/ci/verify_avatar_evacuation.py'
      - '.github/workflows/ogl-net10-shutdown.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  net10-shutdown-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install native VectorRender dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgdiplus
      - name: Static shutdown and migration guards
        run: python3 tools/ci/verify_net10_shutdown.py
      - name: Generate OpenSim project graph
        run: |
          chmod +x runprebuild.sh
          ./runprebuild.sh
      - name: Build .NET10 server and region modules
        run: dotnet build OpenSim.sln -c Release
      - name: Test safe keyframe format and disconnect
        run: dotnet run --project tools/ci/Net10ShutdownRegression/Net10ShutdownRegression.csproj -c Release
      - name: Produce CI-only legacy keyframe fixture on .NET 8
        run: |
          # Prebuild's G1.1 retarget pass rewrites ALL *.csproj to .NET 10.
          # Materialize this historical .NET 8 *fixture only* outside the repo.
          mkdir -p /tmp/ogl-legacy-fixture
          cp tools/ci/LegacyKeyframeFixture/Program.cs /tmp/ogl-legacy-fixture/Program.cs
          cp tools/ci/LegacyKeyframeFixture/LegacyKeyframeFixture.csproj.template /tmp/ogl-legacy-fixture/LegacyKeyframeFixture.csproj
          dotnet run --project /tmp/ogl-legacy-fixture/LegacyKeyframeFixture.csproj -c Release -- /tmp/ogl-legacy-ci.bin
      - name: Convert historical NRBF to typed OGKF without deserialization
        run: |
          dotnet run --project tools/migration/KeyframeLegacyConverter/KeyframeLegacyConverter.csproj -c Release -- /tmp/ogl-legacy-ci.bin /tmp/ogl-keyframe-ci.ogkf
          dotnet run --project tools/ci/Net10ShutdownRegression/Net10ShutdownRegression.csproj -c Release -- /tmp/ogl-keyframe-ci.ogkf
      - name: Stop a real multi-region .NET 10 simulator using its console
        run: python3 tools/ci/smoke_g1_multi_region_shutdown.py --regions 12
      - name: Inject test-only blocked region close in CI checkout
        env:
          OGL_CI_INJECT_HANG: '1'
        run: python3 tools/ci/inject_shutdown_hang_ci_only.py
      - name: Rebuild the throwaway fault-injected simulator
        run: dotnet build OpenSim.sln -c Release
      - name: Verify timeout continues other regions and exits nonzero
        run: python3 tools/ci/smoke_g1_multi_region_shutdown.py --regions 3 --expect-timeout
