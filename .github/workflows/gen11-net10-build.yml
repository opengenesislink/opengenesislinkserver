name: OpenGenesisLINK Generation 1.1 - .NET 10 Build Gate

on:
  push:
    branches:
      - GEN1.1NET10
  pull_request:
    branches:
      - GEN1.1NET10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  net10-build:
    name: .NET 10 generated-project and server build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify retargeting implementation
        run: python3 tools/ci/gen11_retarget_generated_csproj.py --self-test
      - name: Regenerate and normalize project files
        run: |
          chmod +x runprebuild.sh
          ./runprebuild.sh
          python3 tools/ci/gen11_retarget_generated_csproj.py --check
      - name: Restore Generation 1.1 solution
        run: dotnet restore OpenSim.sln
      - name: Build Generation 1.1 server and addons
        run: dotnet build OpenSim.sln --configuration Release --no-restore

      - name: Verify isolated .NET 10 ROBUST runtime on Linux x64
        run: |
          python3 tools/gen11/robust_runtime_smoke.py
          python3 tools/gen11/stage_net10_runtime.py --rid linux-x64 --output "$RUNNER_TEMP/ogl-gen11-core-linux-x64"
          python3 tools/gen11/robust_runtime_smoke.py --bin "$RUNNER_TEMP/ogl-gen11-core-linux-x64/bin"

      - name: Publish Linux x64 .NET 10 core staging runtime
        uses: actions/upload-artifact@v4
        with:
          name: ogl-g11-net10-core-linux-x64
          path: ${{ runner.temp }}/ogl-gen11-core-linux-x64
          if-no-files-found: error
          retention-days: 10

  net10-windows:
    name: .NET 10 Windows x64 build
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Regenerate Windows solution and verify .NET 10 TFMs
        shell: cmd
        run: call runprebuild.bat
      - name: Build Windows server and addons
        shell: cmd
        run: dotnet build OpenSim.sln --configuration Release

      - name: Runtime smoke - boot real ROBUST .NET 10 on Windows x64
        shell: pwsh
        run: |
          python tools/gen11/robust_runtime_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "ROBUST Windows runtime smoke failed" }

      - name: Stage and boot isolated .NET 10 Windows x64 runtime
        shell: pwsh
        run: |
          python tools/gen11/stage_net10_runtime.py --rid win-x64 --output "$env:RUNNER_TEMP/ogl-gen11-core-win-x64"
          if ($LASTEXITCODE -ne 0) { throw "Windows .NET10 server staging failed" }
          python tools/gen11/robust_runtime_smoke.py --bin "$env:RUNNER_TEMP/ogl-gen11-core-win-x64/bin"
          if ($LASTEXITCODE -ne 0) { throw "Windows .NET10 staged ROBUST runtime failed" }

      - name: Publish Windows x64 .NET 10 core staging runtime
        uses: actions/upload-artifact@v4
        with:
          name: ogl-g11-net10-core-windows-x64
          path: ${{ runner.temp }}/ogl-gen11-core-win-x64
          if-no-files-found: error
          retention-days: 10

