name: OGL G1 Standalone Live Node Updater Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/ops/ogl-node-update-live.sh'
      - 'tools/ops/ogl-node-updater.py'
      - 'tools/ops/ogl-node-updater.service'
      - 'tools/ops/ogl-node-updater.env.example'
      - 'tools/ops/install-ogl-node-updater.sh'
      - 'tools/ci/verify_ogl_node_live_updater.py'
      - 'tools/ci/test_ogl_node_update_live_checkout.py'
      - '.github/workflows/ogl-node-live-updater.yml'
      - 'NexVerse/**'
      - 'bin/OpenSim.ini*'
  push:
    branches: [main]
    paths:
      - 'tools/ops/ogl-node-update-live.sh'
      - 'tools/ops/ogl-node-updater.py'
      - 'tools/ops/ogl-node-updater.service'
      - 'tools/ops/ogl-node-updater.env.example'
      - 'tools/ops/install-ogl-node-updater.sh'
      - 'tools/ci/verify_ogl_node_live_updater.py'
      - 'tools/ci/test_ogl_node_update_live_checkout.py'
      - '.github/workflows/ogl-node-live-updater.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater:
    name: Secure detached updater and ROBUST control contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python and shell syntax
        run: |
          python3 -m py_compile tools/ops/ogl-node-updater.py
          python3 -m py_compile tools/ci/verify_ogl_node_live_updater.py
          python3 -m py_compile tools/ci/test_ogl_node_update_live_checkout.py
          bash -n tools/ops/ogl-node-update-live.sh
          bash -n tools/ops/install-ogl-node-updater.sh
      - name: Verify loopback-only updater and command-authorization regressions
        run: python3 tools/ci/verify_ogl_node_live_updater.py
      - name: Test real git reset, backup/restore, Germany file removal and compile sequence
        run: python3 tools/ci/test_ogl_node_update_live_checkout.py
