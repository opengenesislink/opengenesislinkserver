name: Publish OpenGenesisLINK 0.9.3.13 Stable

# Exact-SHA, CI-verified release after explicit operator approval.
on:
  workflow_run:
    workflows: ["NexVerse CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    name: Publish immutable 0.9.3.13 Stable
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact successful main CI SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify approved Stable identity
        id: stable_check
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if ! grep -Fq 'public const string VersionNumber = "0.9.3.13";' OpenSim/Framework/VersionInfo.cs; then
            echo "Not the 0.9.3.13 release train; skip."
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -Fq 'public const Flavour VERSION_FLAVOUR = Flavour.Release;' OpenSim/Framework/VersionInfo.cs; then
            echo "Not the approved 0.9.3.13 Stable flavour; skip."
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -Fq 'public const string AssemblyVersionNumber = "0.9.3.13";' OpenSim/Framework/VersionInfo.cs
          grep -Fq 'MilestoneTitle = "0.9.3.13 Stable' NexVerse/Core/NexVersePlatform.cs
          test -s doc/NexVerse/RELEASE_0.9.3.13.md
          test -s doc/NexVerse/09313_OPERATOR_RELEASE_DECISION.md
          grep -Fq 'Betreiberentscheidung' doc/NexVerse/09313_OPERATOR_RELEASE_DECISION.md
          grep -Fq 'Nachweisausnahme' doc/NexVerse/09313_OPERATOR_RELEASE_DECISION.md
          python3 tools/release/ogl_09313_acceptance_gate.py --self-test
          echo 'eligible=true' >> "$GITHUB_OUTPUT"

      - name: Publish immutable Stable release
        if: steps.stable_check.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="v0.9.3.13"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "$main_sha" != "$RELEASE_SHA" ]; then
            echo "::notice::main changed; refuse to tag outdated SHA."
            exit 0
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Stable release exists. No overwrite."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag already exists without a release: refusing reuse."
            exit 1
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "OpenGenesisLINK 0.9.3.13 Stable" \
            --notes-file doc/NexVerse/RELEASE_0.9.3.13.md \
            --latest
