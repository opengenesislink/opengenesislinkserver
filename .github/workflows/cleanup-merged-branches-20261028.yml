name: One-time cleanup of five already-contained source branches (2026-10-28)

# Second and final operator-approved pass: only the exact 5 audited refs.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-merged-branches-20261028.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    name: Remove exactly five confirmed ancestors of main
    if: github.repository == 'opengenesislink/opengenesislinkserver'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete exact, fully-contained source refs only
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner='opengenesislink', repo='opengenesislinkserver';
            const targets=[
              {
                "name": "docs/world-api-gegenpruefung-r409-20261023",
                "sha": "9fd04acaad55d7d7eae2bbdc4c95c9b4c7df19d8"
              },
              {
                "name": "feat/r287-citizen-portal-api-coverage",
                "sha": "c6e095e2bacc53b6563bc8a7f80f08bedcf2968d"
              },
              {
                "name": "nexverse/firestorm-bridge-script-upload",
                "sha": "74a10ebad921c59ccf3027e6da43337429c50d9a"
              },
              {
                "name": "nexverse/load-regionmodules-addin-current",
                "sha": "65a2dfc1d54d9c357bffe52ad6a60daa46fe4792"
              },
              {
                "name": "nexverse/load-regionmodules-final",
                "sha": "810e8f617b51a141c4f4b12286fca304d641e4d4"
              }
            ];
            if (context.repo.owner !== owner || context.repo.repo !== repo ||
                context.ref !== 'refs/heads/main') {
              throw new Error('Wrong execution context: refusing cleanup');
            }
            const open = await github.paginate(github.rest.pulls.list, {
              owner,repo,state:'open',per_page:100
            });
            const closed = await github.paginate(github.rest.pulls.list, {
              owner,repo,state:'closed',per_page:100
            });
            const veto = new Set([
              ...open.filter(p=>p.head?.repo?.full_name===owner+'/'+repo).map(p=>p.head.ref),
              ...closed.filter(p=>!p.merged_at && p.head?.repo?.full_name===owner+'/'+repo).map(p=>p.head.ref)
            ]);
            let removed=0, skipped=0;
            const errors=[];
            for(const item of targets) {
              try {
                if(veto.has(item.name)) throw new Error('Branch used by open/unmerged PR');
                const before=await github.rest.repos.getBranch({owner,repo,branch:item.name});
                if(before.data.protected || before.data.commit.sha!==item.sha)
                  throw new Error('Branch protected or SHA changed');
                // Compare main...branch: ahead_by=0 means no unmerged commits.
                const cmp=await github.rest.repos.compareCommits({
                  owner,repo,base:'main',head:item.name
                });
                if(cmp.data.ahead_by!==0)
                  throw new Error('Branch has commits not contained in main');
                const fresh=await github.rest.repos.getBranch({owner,repo,branch:item.name});
                if(fresh.data.protected || fresh.data.commit.sha!==item.sha)
                  throw new Error('Branch moved after compare');
                await github.rest.git.deleteRef({owner,repo,ref:'heads/'+item.name});
                removed++;
                core.info(`Deleted fully integrated branch: ${item.name} @ ${item.sha}`);
              } catch(err) {
                skipped++;
                errors.push(`${item.name}: ${err.message}`);
                core.warning(`Skipped ${item.name}: ${err.message}`);
              }
            }
            // The maintenance PR is merged before this push-triggered job starts.
            // Its branch is no longer needed and is removed only if PR #327 is
            // merged and still points to the exact original PR HEAD commit.
            let maintenanceRemoved=0;
            try {
              const pr=await github.rest.pulls.get({owner,repo,pull_number:327});
              const name='maintenance/once-prune-ancestor-branches-20261028';
              const b=await github.rest.repos.getBranch({owner,repo,branch:name});
              if (pr.data.merged && pr.data.head?.ref===name &&
                  pr.data.head?.sha===b.data.commit.sha && !b.data.protected) {
                await github.rest.git.deleteRef({owner,repo,ref:'heads/'+name});
                maintenanceRemoved=1;
                core.info('Removed merged maintenance PR #327 branch.');
              }
            } catch(err) {
              core.warning('Maintenance branch not removed: '+err.message);
            }
            await core.summary
              .addHeading('Additional ancestor cleanup')
              .addTable([
                [{data:'Result',header:true},{data:'Count',header:true}],
                ['Audited targets','5'],
                ['Deleted',String(removed)],
                ['Skipped',String(skipped)],
                ['Merged maintenance branch removed',String(maintenanceRemoved)]
              ])
              .write();
            if(errors.length)core.setFailed(errors.join('; '));
