name: Generation 1 Stable and Updates source policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable Stable and rolling Updates policy
        run: python3 tools/ci/verify_g1_release_channels.py
      - name: Verify package build Python syntax
        run: python3 -m py_compile tools/release/ogl_gen1_snapshot_zip.py
      - name: Check Development, Stable and Update packaging fail-closed
        run: python3 tools/release/ogl_gen1_snapshot_zip.py --self-test
