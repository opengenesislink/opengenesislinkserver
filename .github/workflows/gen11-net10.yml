name: Generation 1.1 .NET 10 Foundation CI

on:
  push:
    branches:
      - GEN1.1NET10
  pull_request:
    branches:
      - develop/generation-1.1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gen11-net10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  net10:
    name: G1.1 .NET 10 Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout G1.1 branch
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Print SDK and runtime diagnostics
        run: |
          dotnet --info
          python3 --version

      - name: Verify Generation 1.1 project targets and runtime configs
        run: python3 tools/gen11/verify_net10.py

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdiplus libc6-dev libopenjp2-tools libopenjp2-7-dev pkg-config

      - name: Regenerate Prebuild solution and retarget to net10.0
        run: |
          bash runprebuild.sh
          python3 tools/gen11/retarget_net10.py --check
          python3 tools/gen11/verify_net10.py

      - name: Restore solution
        run: dotnet restore OpenSim.sln

      - name: Build ROBUST, simulators and linked addons under .NET 10
        run: dotnet build OpenSim.sln --configuration Release --no-restore

      - name: Runtime smoke - boot real ROBUST .NET 10 without DB
        run: python3 tools/gen11/robust_runtime_smoke.py

      - name: Build standalone AssetService addon under .NET 10
        run: bash addon-modules/OGLAssetService/build.sh Release

      - name: Compile OpenJPEG 2.x native hybrid validator
        run: |
          bash addon-modules/OGLImageCodec/build.sh
          ldd bin/lib64/libogl-openjpeg2-x86_64.so
          test -s bin/lib64/libogl-openjpeg2-x86_64.so

      - name: Create native JPEG2000 J2C fixture with OpenJPEG tools
        run: |
          python3 tools/ci/OglImageCodecRegression/make_fixture.py "$RUNNER_TEMP/ogl-codec.pgm"
          opj_compress -i "$RUNNER_TEMP/ogl-codec.pgm" -o "$RUNNER_TEMP/ogl-codec.j2k" -r 20,10,1
          opj_compress -i "$RUNNER_TEMP/ogl-codec.pgm" -o "$RUNNER_TEMP/ogl-codec.jp2" -r 20,10,1
          opj_dump -i "$RUNNER_TEMP/ogl-codec.j2k" >/dev/null
          opj_dump -i "$RUNNER_TEMP/ogl-codec.jp2" >/dev/null

      - name: Share validated J2C and JP2 fixtures with Windows-native tests
        uses: actions/upload-artifact@v4
        with:
          name: ogl-codec-native-fixtures
          path: |
            ${{ runner.temp }}/ogl-codec.j2k
            ${{ runner.temp }}/ogl-codec.jp2
          if-no-files-found: error
          retention-days: 7

      - name: Regression test - OpenJPEG 2.x native hybrid on actual J2C
        env:
          OGL_IMAGE_CODEC_NATIVE_DIR: ${{ github.workspace }}/bin/lib64
        run: |
          dotnet run -c Release --project tools/ci/OglImageCodecRegression/OglImageCodecRegression.csproj -- --hybrid "$RUNNER_TEMP/ogl-codec.j2k"
          dotnet run -c Release --project tools/ci/OglImageCodecRegression/OglImageCodecRegression.csproj -- --hybrid "$RUNNER_TEMP/ogl-codec.jp2"

      - name: Exercise read-only staging corpus validator (synthetic)
        env:
          OGL_IMAGE_CODEC_NATIVE_DIR: ${{ github.workspace }}/bin/lib64
        run: |
          mkdir -p "$RUNNER_TEMP/ogl-asset-corpus"
          cp "$RUNNER_TEMP/ogl-codec.j2k" "$RUNNER_TEMP/ogl-codec.jp2" "$RUNNER_TEMP/ogl-asset-corpus/"
          dotnet run -c Release --project tools/ci/OglImageCodecRegression/OglImageCodecRegression.csproj -- --corpus "$RUNNER_TEMP/ogl-asset-corpus"

      - name: Native OpenJPEG2 malformed-input smoke (Linux x64)
        run: python3 tools/ci/OglImageCodecRegression/fuzz_native.py "$RUNNER_TEMP/ogl-codec.j2k" "$RUNNER_TEMP/ogl-codec.jp2"

      - name: Regression test - OGL Image Codec Engine safe fallback and validation
        run: dotnet run -c Release --project tools/ci/OglImageCodecRegression/OglImageCodecRegression.csproj

      # The legacy native OpenJPEG wrapper currently rejects an independently
      # validated generated codestream. Keep this visible as an experimental
      # diagnostic, not a production-release gate or a silent success.
      - name: Diagnostic - native OpenJPEG compatibility with generated J2C
        continue-on-error: true
        run: |
          ldd bin/lib64/libopenjpeg-dotnet-x86_64.so
          dotnet build -c Release tools/ci/OglImageCodecRegression/OglImageCodecRegression.csproj
          (
            cd tools/ci/OglImageCodecRegression/bin/Release/net10.0
            test -s OpenMetaverse.dll.config
            test -s lib64/libopenjpeg-dotnet-x86_64.so
            dotnet OglImageCodecRegression.dll "$RUNNER_TEMP/ogl-codec.j2k"
          )

      - name: Save native Linux x64 codec artifact
        uses: actions/upload-artifact@v4
        with:
          name: ogl-openjpeg2-linux-x64
          path: bin/lib64/libogl-openjpeg2-x86_64.so
          if-no-files-found: error
          retention-days: 14

      - name: Regression test - IAR preflight on net10
        run: dotnet run -c Release --project tools/ci/OglIarPreflightRegression/OglIarPreflightRegression.csproj

      - name: Regression test - IAR self-service on net10
        run: dotnet run -c Release --project tools/ci/OglIarSelfServiceRegression/OglIarSelfServiceRegression.csproj

      - name: Regression test - NexBus on net10
        run: dotnet run -c Release --project tools/ci/NexBusRegression/NexBusRegression.csproj

      - name: Verify addon and generated project contracts
        run: |
          python3 tools/ci/verify_ogl_energy.py
          python3 tools/ci/verify_gen1_nex_city_addons.py
          python3 tools/ci/verify_iar_progress.py

  windows-native-codec:
    name: G1.1 OpenJPEG2 native Windows x64 / .NET 10
    needs: net10
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: ogl-codec-native-fixtures
          path: codec-fixtures

      - name: Compile native OpenJPEG2 with MSVC and vcpkg
        shell: pwsh
        run: |
          ./addon-modules/OGLImageCodec/build-windows.ps1 -BuildDirectory "$env:RUNNER_TEMP/ogl-codec-win"
          if (-not (Test-Path "bin/lib64/ogl-openjpeg2-x86_64.dll")) { throw "Codec DLL missing" }

      - name: Build G1.1 codec test project
        shell: pwsh
        run: |
          cmd /c runprebuild.bat
          if ($LASTEXITCODE -ne 0) { throw "Prebuild failed" }
          dotnet restore tools/ci/OglImageCodecRegression/OglImageCodecRegression.csproj
          if ($LASTEXITCODE -ne 0) { throw "Restore failed" }
          dotnet build -c Release --no-restore tools/ci/OglImageCodecRegression/OglImageCodecRegression.csproj
          if ($LASTEXITCODE -ne 0) { throw "Codec test compilation failed" }

      - name: Verify Windows-native OpenJPEG2 J2C and JP2 layers
        shell: pwsh
        env:
          OGL_IMAGE_CODEC_NATIVE_DIR: ${{ github.workspace }}/bin/lib64
        run: |
          dotnet run --no-build -c Release --project tools/ci/OglImageCodecRegression/OglImageCodecRegression.csproj -- --hybrid "codec-fixtures/ogl-codec.j2k"
          if ($LASTEXITCODE -ne 0) { throw "Windows native J2C regression failed" }
          dotnet run --no-build -c Release --project tools/ci/OglImageCodecRegression/OglImageCodecRegression.csproj -- --hybrid "codec-fixtures/ogl-codec.jp2"
          if ($LASTEXITCODE -ne 0) { throw "Windows native JP2 regression failed" }

      - name: Exercise read-only staging corpus validator (Windows synthetic)
        shell: pwsh
        env:
          OGL_IMAGE_CODEC_NATIVE_DIR: ${{ github.workspace }}/bin/lib64
        run: |
          dotnet run --no-build -c Release --project tools/ci/OglImageCodecRegression/OglImageCodecRegression.csproj -- --corpus "codec-fixtures"
          if ($LASTEXITCODE -ne 0) { throw "Windows corpus validator failed" }

      - name: Native OpenJPEG2 malformed-input smoke (Windows x64)
        shell: pwsh
        run: |
          python tools/ci/OglImageCodecRegression/fuzz_native.py "codec-fixtures/ogl-codec.j2k" "codec-fixtures/ogl-codec.jp2"
          if ($LASTEXITCODE -ne 0) { throw "Windows native malformed-input smoke failed" }

      - name: Save native Windows x64 codec artifact
        uses: actions/upload-artifact@v4
        with:
          name: ogl-openjpeg2-windows-x64
          path: bin/lib64/ogl-openjpeg2-x86_64.dll
          if-no-files-found: error
          retention-days: 14
