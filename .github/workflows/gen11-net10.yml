name: Generation 1.1 .NET 10 Foundation CI

on:
  push:
    branches:
      - GEN1.1NET10
  pull_request:
    branches:
      - develop/generation-1.1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gen11-net10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  net10:
    name: G1.1 .NET 10 Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout G1.1 branch
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Print SDK and runtime diagnostics
        run: |
          dotnet --info
          python3 --version

      - name: Verify Generation 1.1 project targets and runtime configs
        run: python3 tools/gen11/verify_net10.py

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdiplus libc6-dev libopenjp2-tools libopenjp2-7-dev pkg-config

      - name: Regenerate Prebuild solution and retarget to net10.0
        run: |
          bash runprebuild.sh
          python3 tools/gen11/retarget_net10.py --check
          python3 tools/gen11/verify_net10.py

      - name: Restore solution
        run: dotnet restore OpenSim.sln

      - name: Build ROBUST, simulators and linked addons under .NET 10
        run: dotnet build OpenSim.sln --configuration Release --no-restore

      - name: Build standalone AssetService addon under .NET 10
        run: bash addon-modules/OGLAssetService/build.sh Release

      - name: Compile OpenJPEG 2.x native hybrid validator
        run: |
          bash addon-modules/OGLImageCodec/build.sh
          ldd bin/lib64/libogl-openjpeg2-x86_64.so
          test -s bin/lib64/libogl-openjpeg2-x86_64.so

      - name: Create native JPEG2000 J2C fixture with OpenJPEG tools
        run: |
          python3 tools/ci/OglImageCodecRegression/make_fixture.py "$RUNNER_TEMP/ogl-codec.pgm"
          opj_compress -i "$RUNNER_TEMP/ogl-codec.pgm" -o "$RUNNER_TEMP/ogl-codec.j2k" -r 20,10,1
          opj_compress -i "$RUNNER_TEMP/ogl-codec.pgm" -o "$RUNNER_TEMP/ogl-codec.jp2" -r 20,10,1
          opj_dump -i "$RUNNER_TEMP/ogl-codec.j2k" >/dev/null
          opj_dump -i "$RUNNER_TEMP/ogl-codec.jp2" >/dev/null

      - name: Regression test - OpenJPEG 2.x native hybrid on actual J2C
        env:
          OGL_IMAGE_CODEC_NATIVE_DIR: ${{ github.workspace }}/bin/lib64
        run: |
          dotnet run -c Release --project tools/ci/OglImageCodecRegression/OglImageCodecRegression.csproj -- --hybrid "$RUNNER_TEMP/ogl-codec.j2k"
          dotnet run -c Release --project tools/ci/OglImageCodecRegression/OglImageCodecRegression.csproj -- --hybrid "$RUNNER_TEMP/ogl-codec.jp2"

      - name: Regression test - OGL Image Codec Engine safe fallback and validation
        run: dotnet run -c Release --project tools/ci/OglImageCodecRegression/OglImageCodecRegression.csproj

      # The legacy native OpenJPEG wrapper currently rejects an independently
      # validated generated codestream. Keep this visible as an experimental
      # diagnostic, not a production-release gate or a silent success.
      - name: Diagnostic - native OpenJPEG compatibility with generated J2C
        continue-on-error: true
        run: |
          ldd bin/lib64/libopenjpeg-dotnet-x86_64.so
          dotnet build -c Release tools/ci/OglImageCodecRegression/OglImageCodecRegression.csproj
          (
            cd tools/ci/OglImageCodecRegression/bin/Release/net10.0
            test -s OpenMetaverse.dll.config
            test -s lib64/libopenjpeg-dotnet-x86_64.so
            dotnet OglImageCodecRegression.dll "$RUNNER_TEMP/ogl-codec.j2k"
          )

      - name: Regression test - IAR preflight on net10
        run: dotnet run -c Release --project tools/ci/OglIarPreflightRegression/OglIarPreflightRegression.csproj

      - name: Regression test - IAR self-service on net10
        run: dotnet run -c Release --project tools/ci/OglIarSelfServiceRegression/OglIarSelfServiceRegression.csproj

      - name: Regression test - NexBus on net10
        run: dotnet run -c Release --project tools/ci/NexBusRegression/NexBusRegression.csproj

      - name: Verify addon and generated project contracts
        run: |
          python3 tools/ci/verify_ogl_energy.py
          python3 tools/ci/verify_gen1_nex_city_addons.py
          python3 tools/ci/verify_iar_progress.py
