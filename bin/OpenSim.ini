; OpenGenesisLINK Generation 1 – Stadt NexVerse Simulator
; Konfigurationsvertrag: aktive Werte hier ueberschreiben OpenSimDefaults.ini
; und je nach Modul config-include/GridHypergrid.ini / GridCommon.ini.
; NICHT JEDE verfuegbare Option muss hier stehen: nicht angegebene Schluessel
; werden bewusst aus Defaults/Code geladen; siehe G1_CONFIG_AUDIT.md.
; KRITISCH: Produktions-OpenSim.ini vor Updates sichern. Keine Secrets in Git.
; ================================================================
; OpenGenesisLINK 0.9.3.10 compact simulator INI
; Active overrides only. Defaults in OpenSimDefaults.ini / config-include/*.ini.
; Runtime secrets and instance state must not be committed.

; OpenGenesisLINK Feature Control - standardmäßig aktiviert.
; Voraussetzung: öffentlicher ES256-Schlüssel und gültige, vom ROBUST signierte
; Node-Freigabe. Ohne Richtlinie sind OAR-/IAR-Archive absichtlich gesperrt.
; ES256-Feature-Control: PublicKeyPath darf NUR den Public Key
; enthalten. PrivateKey liegt ausschliesslich auf ROBUST.
; Keyrotation ohne alle Node-Policies kann OAR-/IAR-Aktionen sperren.
[OGLFeatureControl]
    Enabled = true
    PublicKeyPath = "config-include/ogl-feature-public.pem"

; Graceful resident relocation on region restart and simulator shutdown.
; Region restart selects the closest online region on this grid.
; Full shutdown excludes every region on this simulator process.
; Failed region evacuation cancels restart instead of disconnecting residents.
[NexVerseAvatarEvacuation]
    Enabled = true
    WaitSeconds = 25

; KRITISCH: Jeder Simulator braucht eine eindeutige NodeId.
; SharedKey/PeerUrl/Signaturen muessen zu ROBUST [NexBus] passen.
; Kein Logging/Management an nicht autorisierte Nodes senden.
[NexVerseNodeAgent]
    Enabled = true
    ; Jede Simulatorinstanz benoetigt eine eigene NodeId. Fuer Stadt-NexVerse: Mainland_Server_001.
    ; Niemals eine konkrete Instanzkennung als universellen GitHub-Standard setzen.
    NodeId = "${Environment|NEXVERSE_NODE_ID}"
    PeerUrl = "${Environment|NEXVERSE_NEXBUS_PEER_URL}"
    SharedKey = "${Environment|NEXVERSE_NEXBUS_SHARED_KEY}"
    InboundPath = "/internal/nexbus/v1/events"
    HeartbeatSeconds = 30
    QueueCapacity = 2048
    RequestTimeoutMilliseconds = 2000
    DeduplicationWindow = 10000
    CrossRegionObjectMessaging = true
    CrossRegionChatMessaging = true
    AllowCrossOwnerObjectMessages = true
    EstateScriptMessaging = true
    ; Generation 1: explicit opt-in for global cross-estate object signals.
    ; llGridSay is restricted to Estate Owner/Manager-owned source objects.
    GridScriptMessaging = true
    ObjectMessagesPerSecond = 20
    ObjectMessageMaxAgeSeconds = 30
    ManagedRegionCommands = false
    ; Official GitHub main => separate staging only; no service restart/INI overwrite.
    ; Requires NexBus and simulators:manage authorization at ROBUST.
    UpdateStagingEnabled = false
    UpdateStagingRoot = "/opt/opengenesislink-updates"
    UpdateStagingBuild = true
    ManagedRegionConfigDirectory = "Regions/NexVerseManaged"
    ManagedRegionInternalAddress = "0.0.0.0"
    ManagedRegionExternalHostName = ""
    ManagedRegionType = "NexVerse Managed"
    ManagedRegionPortMin = 9300
    ManagedRegionPortMax = 9399

[OpenGenesisLINKOAR]
    Enabled = true
    StorageRoot = "OGLArchives"
    MaximumArchiveMiB = 20480
    MigrationStorageId = ""

[Const]
    BaseHostname = "hg.stadt-nexverse.de"
    BaseURL = http://${Const|BaseHostname}
    PublicPort = "80"
    PrivURL = ${Const|BaseURL}
    PrivatePort = "8003"
; Stadt NexVerse: serverseitige Grundstueckskosten fuer Mesh-Linksets.
; Enabled=true wertet bestehende Mesh-Bauten neu (Land Impact statt Primanzahl).
; Nur mit vorherigem Backup/Kapazitaetstest abschalten oder umkonfigurieren.
[OGLMeshLandImpact]
    Enabled = true
; KRITISCH: Physics=BulletSim, meshing=Meshmerizer, YEngine und
; vorhandene Zertifikatsoptionen nur mit Build-, Script- und Rez-Tests aendern.
; Keine produktiven Passwoerter im Klartext eintragen.
[Startup]
    ; OGL 0.9.3.13: Live-Profil, Opt-in fuer erweiterte Regionssicht.
    ; 1024 m MaxDrawDistance / 768 m MaxRegionsViewDistance als Preset;
    ; hohe Sichtweite kann Child-Agent-, Netzwerk- und Renderlast erhoehen.
    ; Vor breiter Aktivierung Firestorm-, VarRegion- und HG-Gates pruefen.
    OGLExtendedRegionVisibility = true
    ; MaxDrawDistance = 1024
    ; MaxRegionsViewDistance = 768
    ; MinRegionsViewDistance = 96

    ; IAR-Fortschritt live an der lokalen Konsole anzeigen.
    OGLIarLiveProgress = true
    meshing = Meshmerizer
    physics = BulletSim
    EnableCertConverter = false
    PemCertPublicKey = ""
    PemCertPrivateKey = ""
    outputCertName = "letsencrypt"
    outputCertPassword = ""
    EnableSelfsignedCertSupport = false
    CertRenewOnStartup = false
    CertFileName = "OpenSim"
    CertPassword = "mycertpass"
    CertHostName = "mainland.stadt-nexverse.de"
    CertHostIp = "127.0.0.1"

[AccessControl]
    ; Generation 1 viewer admission: local login, Hypergrid arrival and region entry.
    ; Approved viewers: Firestorm, OpenGenesisLINK/OGL, Radegast-ng, WolfViewer-Release, Frivolin Viewer.
    ; Unknown, Darkstorm, Hydrastorm and other nonapproved viewer names are refused.
    ; WARNING: viewer-reported channel/version can be spoofed. Not DRM or proof of identity.
    OGLApprovedViewersOnly = true


[Map]
    GenerateMaptiles = true
    ; OGL FastMap 2.0: opt in after testing (keep true for normal map rendering).
    FastMapAsyncStartup = true
    FastMapStartupDelaySeconds = 45
    MapImageModule = "Warp3DImageModule"
    TextureOnMapTile = true
    DrawPrimOnMapTile = true
    TexturePrims = true
    RenderMeshes = true
    ; Exclude objects (including meshes) above absolute region Z=500m
    ; from generated Warp3D map tiles. Does not hide or delete inworld objects.
    RenderMaxHeight = 500

[Permissions]
    automatic_gods = false
    implicit_gods = false
    allow_grid_gods = true

[Estates]
; EstateModule steuert Estate-Kommunikation (NICHT [EstateManagement]).
; Handler/Port sind an die internen Estate-Routen gekoppelt. Port=0 benutzt
; den lokalen Simulator-HTTP-Port. KRITISCH: Port nicht oeffentlich freigeben.
; Das historische Modul nutzt einen Default-Token im Quellcode: nur interne
; vertrauenswuerdige Netze zulassen; geheime Tokens nicht in Git ablegen.
    EstateCommunicationsHandler = "EstateModule"
    Port = 0

[SMTP]
; LSL/E-Mail-Modul; unabhaengig vom [OfflineIMEmail]-SMTP-Relay.
; NICHT EINSCHALTEN, solange kein dedizierter, TLS-validierter Mail-Transport
; mit eigenen Zugangsdaten konfiguriert wurde. Offline-IM bleibt separat aktiv.
    enabled = false

; KRITISCH: http_listener_port=0 erfordert NexVerseAutoPorts.
; Proxy, Gatekeeper und externe Ports muessen sich weiterhin erreichen.
[Network]
    http_listener_port = 0
    ExternalHostNameForLSL = "mainland.stadt-nexverse.de"
    shard = "OpenSim"

; Port 0 selects a free TCP port when Enabled=true.
[NexVerseAutoPorts]
    Enabled = true
    HttpPortMin = 9000
    HttpPortMax = 9099

[XMLRPC]
    XmlRpcRouterModule = "XmlRpcRouterModule"
    XmlRpcPort = -1

[ClientStack.LindenUDP]
; Viewer UDP: Werte aus der vorhandenen LLUDPServer-Implementation.
; BITTE NICHT ohne Loadtest aendern: UDP-Bandbreite, ACK/Timeouts
; und Buffer beeinflussen Firestorm-Login, Textur- und Mesh-Ladevorgaenge.
; Vorhandene Module haben diese Defaults schon bei leerem Block benutzt.
    scene_throttle_max_bps = 6250000
    TextureSendLimit = 20
    AckTimeout = 60
    PausedAckTimeout = 300

[ClientStack.LindenCaps]
    Cap_GetTexture = "localhost"
    Cap_GetMesh = "localhost"
    Cap_AvatarPickerSearch = "localhost"
    Cap_GetDisplayNames = "localhost"
    Cap_SetDisplayName = "localhost"

[SimulatorFeatures]
    SearchServerURI = "https://stadt-nexverse.de/service/search?q=[QUERY]&type=[TYPE]&maturity=[MATURITY]"
    DestinationGuideURI = "https://stadt-nexverse.de/service/destination"

[Chat]
; Reichweite des normalen lokalen Chats in Metern. Keine Voice-Option.
; Aenderungen betreffen LSL-Sensorik/Chat-Hoerbarkeit in allen Regionen.
    enabled = true
    whisper_distance = 10
    say_distance = 20
    shout_distance = 100

[EntityTransfer]
; Regionswechsel und Hypergrid-Teleport. KRITISCH: Border-Transfers
; NICHT deaktivieren; Stadt NexVerse benutzt mehrere Simulatorprozesse.
; LevelHGTeleport = Mindest-Userlevel fuer HG-TP (0 = alle Benutzer).
    AllowAvatarCrossing = true
    DisableObjectTransfer = false
    LevelHGTeleport = 0
    DisableInterRegionTeleportCancellation = false
    LandingPointBehavior = LandingPointBehavior_OS

[Messaging]
    OfflineMessageModule = "Offline Message Module V2"

; Mailbenachrichtigung bei Offline-IM, unabhaengig von [SMTP].
; KRITISCH: SMTPHost web01.nexvortex.de, Port 587 und STARTTLS gehoeren
; zusammen; Passwort nur via NEXVERSE_OFFLINE_IM_SMTP_PASSWORD liefern.
; RelaySigningKey mit ROBUST OfflineIMMailRelay synchronisieren.
[OfflineIMEmail]
    Enabled = true
    RelayDomain = "im.stadt-nexverse.de"
    SubjectTemplate = "Offline-IM Nachricht von {SENDER}"
    RelaySigningKey = "${Environment|NEXVERSE_IM_RELAY_SIGNING_KEY}"
    ReplyLifetimeDays = 5
    SMTPHost = "web01.nexvortex.de"
    SMTPPort = 587
    UseStartTls = true
    UseSslOnConnect = false
    SMTPUsername = "relay@im.stadt-nexverse.de"
    SMTPPassword = "${Environment|NEXVERSE_OFFLINE_IM_SMTP_PASSWORD}"
    PerSenderPerHour = 30
    PerRecipientPerHour = 60
    GlobalPerHour = 500

[BulletSim]
    AvatarToAvatarCollisionsByDefault = true

[Wind]
; Einfache Simulator-Winddaten, NICHT das Wetteraddon [OGLWeather].
; Windplugin-Wechsel kann physische Objekte/LSL beeinflussen.
    enabled = true
    wind_update_rate = 150
    wind_plugin = SimpleRandomWind
    strength = 1.0

[Materials]
; Material-/PBR-Services fuer Viewer. Zur Firestorm-Kompatibilitaet
; aktiviert lassen; MaxMaterialsPerTransaction ist Request-Obergrenze.
    enable_materials = true
    MaxMaterialsPerTransaction = 50

[DataSnapshot]
; Legacy-Suche/externes Indexieren: aus Datenschutzgruenden AUS.
; Unabhaengig von WorldAPI/NexDiscovery. NICHT spontan einschalten,
; sonst koennen oeffentliche Such-Crawler Regionsdaten erfassen.
    index_sims = false
    data_exposure = minimum
    gridname = "Stadt NexVerse"
    default_snapshot_period = 1200
    snapshot_cache_directory = "DataSnapshot"

[Economy]
    economymodule = NexVerseMoneyModule

; OGL Viewer Advisor: opt-in recommendation for users of other viewers.
; The module is intentionally disabled until explicitly enabled.
[OGLViewerAdvisor]
    Enabled = false
    IntervalMinutes = 60
    OfficialViewerPrefixes = "OpenGenesisLINK;OGL Viewer"
    Message = "Um das volle Erlebnis von OpenGenesisLINK geniessen zu koennen, steigen Sie auf den offiziellen OGL Viewer um: https://opengenesislink.de"

[NexDiscoveryViewer]
    Enabled = true
    LegacyFirestormCompatibility = true
    WorldApiBaseUrl = "https://world.stadt-nexverse.de"
    ; Backend-only Gruppenland-API-Schluessel; nicht im Repository hinterlegen.
    GroupLandApiKey = "${Environment|NEXVERSE_GROUP_LAND_API_KEY}"
    RequestTimeoutMilliseconds = 3000

[NexExperiencesViewer]
    ; 0.9.3.10 stabilization: Firestorm Experiences are not released.
    ; Preserve implementation/tests but do not advertise viewer CAPS or consent.
    ; A later own-viewer 2.0 scope may be explicitly planned.
    Enabled = false
    WorldApiBaseUrl = "https://world.stadt-nexverse.de"
    ApiKey = "${Environment|NEXVERSE_EXPERIENCES_API_KEY}"
    RequestTimeoutMilliseconds = 3000
    FirestormReadCaps = true
    FirestormPermissionCaps = true
    ScriptPendingConsent = true
    NativeExperiencePrompt = true
    ViewerPermissionsApiKey = "${Environment|NEXVERSE_EXPERIENCES_VIEWER_PERMISSIONS_API_KEY}"
    FirestormManageCaps = true
    ViewerManageApiKey = "${Environment|NEXVERSE_EXPERIENCES_VIEWER_MANAGE_API_KEY}"

[NexEconomyViewer]
    Enabled = true
    WorldApiBaseUrl = "https://world.stadt-nexverse.de"
    ApiKey = "${Environment|NEXVERSE_ECONOMY_API_KEY}"
    FeeWalletId = ""
    UploadCharge = 0
    GroupCreationCharge = 0
    RequestTimeoutMilliseconds = 3000
    BalanceRefreshSeconds = 5
    ; Enable NV$ wallets for authenticated Hypergrid visitors. No foreign-grid currency transfer.
    AllowHypergridGuests = true
    MasterBankEnabled = false
    MasterBankAccountId = "6571e388-6218-4574-87db-f9379718315e"
    MasterBankOperatorId = ""
    MasterBankAuthorizedScripts = ""
    MasterBankMaxPayout = 100
    CurrencyPurchasePortalUrl = ""

[YEngine]
; Produktions-Scriptengine. DefaultScriptEngine ist in [Startup] YEngine.
; KRITISCH: Enginewechsel kann Scriptstatus/Timer nach Teleport beeintraechtigen.
; MinTimerInterval 0.1s verhindert uebermaessig schnelle Timer.
    Enabled = true
    UseSourceHashCode = true
    MinTimerInterval = 0.1

[XEngine]
    AppDomainLoading = false

[NexPortalIM]
    ; HMAC-signed forwarder: must match ROBUST NEX_PORTAL_IM_SECRET.
    ; Reverse proxy must forward this internal path to ROBUST,
    ; restricted to trusted simulator source IPs.
    Enabled = true
    IngestUrl = "https://world.stadt-nexverse.de/internal/nexportal/im/v1"
    SharedSecret = "${Environment|NEX_PORTAL_IM_SECRET}"

[OSSL]
    Include-osslDefaultEnable = "config-include/osslDefaultEnable.ini"

; KRITISCH: Groups V2 und Messaging sind mit ROBUST gekoppelt.
; Ohne gemeinsame Gruppenautoritaet funktionieren Land- und HG-Rechte nicht.
[Groups]
    Enabled = true
    Module = "Groups Module V2"
    ServicesConnectorModule = "Groups HG Service Connector"
    LocalService = remote
    GroupsServerURI = "${Const|PrivURL}:${Const|PrivatePort}"
    MessagingEnabled = true
    MessagingModule = "Groups Messaging Module V2"
    NoticesEnabled = true
    MessageOnlineUsersOnly = true

[InterestManagement]
    FastRezNearbyFirst = true

[MediaOnAPrim]
; Web- und Videooberflaechen auf Prims; Viewer-CAPS erforderlich.
; Nicht mit Hypergrid-Medien-Richtlinien verwechseln.
    Enabled = true

[NPC]
    Enabled = true
    ; NPC owner directory and private direct-IM archive for Stadt NexVerse.
    ; Secure HTTPS endpoints and secrets come from process environment;
    ; no credentials are committed to the repository.
    NexNPCSnapshotEnabled = true
    NexNPCChatEnabled = true

[Terrain]
; Terrain-Default nur beim erstmaligen Regionsaufbau wirksam.
; Viewer-Terrainupdates und Malpinselstarke sind laufende Einstellungen.
; KRITISCH: Terrainwerte vor Region-Neuerstellung/OAR-Import sichern.
    InitialTerrain = "pinhead-island"
    SendTerrainUpdatesByViewDistance = true
    OglTerrainBrushStrengthMultiplier = 2.0

[LandManagement]
; Parzellen-Layer-Aktualisierungen/Verbotlinien in Firestorm.
; LimitParcelLayerUpdateDistance optimiert grosse VarRegionen.
; Keine Einstellung ersetzt die serverseitigen Gruppen-/Landrechte.
    LimitParcelLayerUpdateDistance = true
    ParcelLayerViewDistance = 128
    ShowParcelBansLines = true

[UserProfiles]
    ProfileServiceURL = ${Const|BaseURL}:${Const|PublicPort}

[FirestormBridge]
    Enabled = true

[Textures]
    ; Generation 1: retain superseded dynamic textures briefly so viewer
    ; requests for the previous image do not hit an immediately expired asset.
    ; Bounds protect against a high number of minute-by-minute display updates.
    DynamicTexturePreviousRetentionSeconds = 30
    DynamicTexturePreviousRetentionLimit = 256

[Appearance]
    PersistBakedTextures = true
    ReuseTextures = true
    DelayBeforeAppearanceSend = 1
    DelayBeforeAppearanceSave = 3
    ; OGL FastRez pilot: revert to 4000 on viewer/HG login regressions.
    WearablesRequestDelayMs = 1000
    ResendAppearanceUpdates = false

[XBakes]
; Altes externes Baked-Texture-Endpoint-Modul. Ohne URL deaktiviert.
; NICHT auf eine fremde HTTP-URL umstellen: Avatar-Texturen/Assets sind
; privat. Verwechsle das nicht mit [Appearance] und ROBUST BakedTextureService.
    URL = ""


; ============================================================================
; Stadt-NexVerse Generation 1: City Addons (SIMULATOR ONLY)
; Requires the matching OpenGenesisLINK.Addons.*.dll in this simulator's bin/.
; These modules are deliberately enabled for the Stadt-NexVerse deployment.
; They send display state to optional LSL listeners, not physical bus/traffic
; motion. Schedule/junction examples below must be adapted to each city.
; For other installations, set Enabled = false until configured.
; ============================================================================

[NexTraffic]
    Enabled = true
    LSLChannel = -835421
    RefreshSeconds = 5
    GreenSeconds = 30
    YellowSeconds = 5
    AllRedSeconds = 3
    ; JunctionName:phaseOffsetSeconds; semicolon separates junctions.
    Junctions = Hauptstrasse:0;Marktplatz:11

[NexTransit]
    Enabled = true
    LSLChannel = -835422
    RefreshSeconds = 30
    TimeZone = Europe/Berlin
    MaxDepartures = 5
    ; Deterministic DEMO timetables, not real-time bus departures.
    ; line,destination,headwayMinutes,firstMinuteAfterMidnight,stopRegion
    ; Replace with the actual published timetable before going live.
    Routes = 101,Magdeburg,10,0,*;150,Jenseits,20,15,*

[NexSmartLight]
    Enabled = true
    LSLChannel = -835423
    RefreshSeconds = 60
    TimeZone = Europe/Berlin
    ; Uses real Europe/Berlin clock time, not EEP sunrise/sunset.
    NightStarts = 18:00
    NightEnds = 06:00

[OGLWeather]
    Enabled = true
    WeatherSeed = 20261028
    TimeZone = "Europe/Berlin"
    LSLChannel = -835311
    CurrentBroadcastSeconds = 60
    ForecastBroadcastSeconds = 300
    CloudBaseMeters = 200
    ; Firestorm: temporary, script-free and nonpersistent particle emitters.
    LegacyParticleEmitters = true
    ViewerEnvironmentEffects = true
    EmitterHeightMeters = 22
    EmitterSpacingMeters = 96
    MaxEmittersPerRegion = 16
    VisualRefreshSeconds = 12
    ; Temporary operator-only weather testing (off by default).
    ; Console: ogl weather rain 80 10 | ogl weather snow 70 10
    ; Revert immediately: ogl weather auto
    TestWeatherMode = auto
    TestWeatherIntensity = 70
    TestWeatherDurationMinutes = 15

; Generation 1 OGLEnergy (SIMULATOR ONLY).
; Opt-in virtual grid: no changes to existing resident objects or lighting.
; After first inworld tests, set Enabled = true and restart the simulator.
[OGLEnergy]
    Enabled = false
    LSLChannel = -835431
    RefreshSeconds = 60
    TimeZone = Europe/Berlin
    SolarCapacityKw = 900
    WindCapacityKw = 1000
    HydroCapacityKw = 500
    BaseCapacityKw = 850
    BaseDemandKw = 2200

; ============================================================================
; Resident IAR: WebDAV NAS is the default transport. Native archive working
; files are temporary and MUST fit the configured size. The operator IAR
; storage location is not changed automatically.
; Match the tracked ROBUST WebDAV endpoint and account; password stays in /etc/opengenesislink/.
; IAR sichert Benutzerinventar und schreibt per WebDAV auf das NAS.
; WebDavBaseUrl, TLS-Zertifikat und PasswordFile muessen zusammenpassen.
; Kein NFS auf OpenVZ ohne Kernelmodul; Restore vor Umstellung testen.
[OpenGenesisLINKIAR]
    Enabled = true
    StorageBackend = "WebDAV"
    NasHost = "10.78.0.4"
    WebDavBaseUrl = "https://10.78.0.4:5006/Server/Benutzer/Weiss_Joerg/NexVerse/IAR-Backups/"
    WebDavUsername = "ogl-iar"
    WebDavPasswordFile = "/etc/opengenesislink/iar-webdav.pass"
    MaximumArchiveMiB = 10240

; KRITISCH: Include-Architecture waehlt Grid-/Hypergrid-Service-Endpunkte.
; Nicht in Standalone.ini oder einen fremden Host tauschen: HG und Inventory
; muessen zum lokalen ROBUST-Service und zur Datenbank passen.
[Architecture]
    Include-Architecture = "config-include/GridHypergrid.ini"

